name: movie-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie_postgres_data:/var/lib/postgresql/data
      - ../database/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - movie-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: movie-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movie-network

  ppl-service:
    build:
      context: ../backend
      dockerfile: ppl-service/Dockerfile
    container_name: movie-ppl-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgresPassword}
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movie-network

  movie-service:
    build:
      context: ../backend
      dockerfile: movie-service/Dockerfile
    container_name: movie-movie-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgresPassword}
      PPL_SERVICE_HOST: ppl-service
      PPL_SERVICE_PORT: 9090
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      ppl-service:
        condition: service_started
    networks:
      - movie-network

volumes:
  movie_postgres_data:
    name: movie_postgres_data

networks:
  movie-network:
    name: movie_network
