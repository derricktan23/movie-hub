server:
  port: 8081

spring:
  application:
    name: movie-service
  graphql:
    graphiql:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/movie_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgresPassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

grpc:
  client:
    ppl-service:
      address: 'static://${PPL_SERVICE_HOST:localhost}:${PPL_SERVICE_PORT:9090}'
      negotiation-type: plaintext

tmdb:
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p/w500
  read-access-token: ${TMDB_READ_ACCESS_TOKEN:}
